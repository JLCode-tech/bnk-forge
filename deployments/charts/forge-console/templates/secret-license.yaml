{{- if not .Values.license.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "forge-console.licenseSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "forge-console.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.license.secretKey }}: {{ .Values.license.licenseData | quote }}
{{- end }}
