{{- if not .Values.enrollment.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "forge-agent.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "forge-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  console-url: {{ .Values.enrollment.consoleUrl | quote }}
  enrollment-token: {{ .Values.enrollment.enrollmentToken | quote }}
  cluster-name: {{ .Values.enrollment.clusterName | quote }}
  cluster-id: {{ .Values.enrollment.clusterId | quote }}
{{- end }}
