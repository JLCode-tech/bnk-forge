apiVersion: v1
kind: Namespace
metadata:
  name: forge-system
  labels:
    app.kubernetes.io/name: forge-system
    app.kubernetes.io/part-of: bnk-forge
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forge-agent
  namespace: forge-system
  labels:
    app.kubernetes.io/name: forge-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: forge-agent
  labels:
    app.kubernetes.io/name: forge-agent
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["k8s.f5net.com", "cne.f5.com"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: forge-agent
  labels:
    app.kubernetes.io/name: forge-agent
subjects:
  - kind: ServiceAccount
    name: forge-agent
    namespace: forge-system
roleRef:
  kind: ClusterRole
  name: forge-agent
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: forge-agent
  namespace: forge-system
  labels:
    app.kubernetes.io/name: forge-agent
    app.kubernetes.io/component: edge-telemetry
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: forge-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forge-agent
    spec:
      serviceAccountName: forge-agent
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      containers:
        - name: forge-agent
          image: ghcr.io/jlcode-tech/forge-agent:v1.0.0-pov
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            capabilities:
              add:
                - SYS_ADMIN
                - BPF
                - NET_ADMIN
          env:
            - name: CONSOLE_URL
              valueFrom:
                secretKeyRef:
                  name: forge-agent-enrollment
                  key: console-url
            - name: ENROLLMENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forge-agent-enrollment
                  key: enrollment-token
            - name: CLUSTER_NAME
              valueFrom:
                secretKeyRef:
                  name: forge-agent-enrollment
                  key: cluster-name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CERT_DIR
              value: "/var/lib/forge-agent/certs"
            - name: SPOOL_DIR
              value: "/var/lib/forge-agent/spool"
          resources:
            requests:
              cpu: 50m
              memory: 40Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: tmm-socket
              mountPath: /var/run/tmm
              readOnly: true
            - name: agent-data
              mountPath: /var/lib/forge-agent
            - name: sys-kernel-debug
              mountPath: /sys/kernel/debug
              readOnly: true
      volumes:
        - name: tmm-socket
          hostPath:
            path: /var/run/tmm
            type: DirectoryOrCreate
        - name: agent-data
          hostPath:
            path: /var/lib/forge-agent
            type: DirectoryOrCreate
        - name: sys-kernel-debug
          hostPath:
            path: /sys/kernel/debug
            type: DirectoryOrCreate
